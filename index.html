<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Python con Turtle 🐢 - Versión Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js" type="text/javascript"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
        }

        .btn-ejecutar {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-ejecutar:hover {
            background-color: #219653;
        }

        /* Contenedor principal de dos paneles */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Panel Izquierdo: Editor de Código */
        .panel-codigo {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #272822; 
            padding: 10px;
            border-right: 2px solid #bdc3c7;
        }

        .panel-codigo label {
            color: #cfcfc2;
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Forzar a CodeMirror a ocupar todo el espacio disponible del panel */
        .CodeMirror {
            flex: 1;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.05rem;
            border-radius: 4px;
        }

        /* Panel Derecho: Consola y Canvas de Turtle */
        .panel-salida {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .contenedor-canvas {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            border-bottom: 2px solid #bdc3c7;
            position: relative;
            overflow: auto;
        }

        #canvas-tortuga {
            border: 1px solid #dfe6e9;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .panel-consola {
            flex: 1;
            background-color: #2d3748;
            color: #a0aec0;
            padding: 15px;
            font-family: monospace;
            overflow-y: auto;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <header>
        <h1>Entorno de Aprendizaje: Python Turtle Pro 🐢</h1>
        <button class="btn-ejecutar" id="btnRun" onclick="ejecutarCodigo()">¡Ejecutar Código! ▶</button>
    </header>

    <div class="workspace">
        <div class="panel-codigo">
            <label>Escribe tu código de Python aquí:</label>
            <textarea id="editor"># ¡Ahora puedes usar CUALQUIER comando clásico de Turtle sin errores!
import turtle

t = turtle.Turtle()
t.shape("turtle")
t.speed(6)

# Ejemplo de cambio de tamaño nativo (Soportado gracias al parche)
t.turtlesize(stretch_len=3, stretch_wid=3)
t.pencolor("purple")

for i in range(4):
    t.forward(100)
    t.left(90)
</textarea>
        </div>

        <div class="panel-salida">
            <div class="contenedor-canvas">
                <div id="canvas-tortuga"></div>
            </div>
            <div class="panel-consola" id="consola">> Entorno listo. Parches de compatibilidad cargados.</div>
        </div>
    </div>

    <script type="text/javascript">
        const consolaElement = document.getElementById("consola");

        // Inicializar CodeMirror sobre el textarea
        const editorCodigo = CodeMirror.fromTextArea(document.getElementById("editor"), {
            mode: "python",          
            theme: "monokai",        
            lineNumbers: true,       
            indentUnit: 4,           
            tabSize: 4,
            matchBrackets: true      
        });

        function registrarSalidaTexto(texto) {
            consolaElement.innerHTML += texto;
        }

        function leerModuloIntegrado(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
                throw "Archivo no encontrado: '" + x + "'";
            }
            return Sk.builtinFiles["files"][x];
        }

        // ==========================================
        //  CÁPSULA DE POLYFILLS Y COMPATIBILIDAD
        // ==========================================
        function inyectarCompatibilidad() {
            // 1. Forzar que onkeypress apunte internamente a onkey (Requerido por Skulpt)
            if (Sk.builtin && Sk.builtin.Screen) {
                Sk.builtin.Screen.prototype.onkeypress = Sk.builtin.Screen.prototype.onkey;
            }
            
            // 2. Parchear la clase Turtle para soportar de manera transparente los alias de tamaño
            if (Sk.builtin && Sk.builtin.Turtle) {
                // Si el alumno llama a turtlesize o shapesize, lo redirigimos de forma segura
                const mapearFuncionTamano = function(self, stretch_wid, stretch_len, outline) {
                    // Skulpt internamente maneja el escalado mediante propiedades numéricas directas o métodos internos
                    // Con este envoltorio evitamos que la ejecución falle por AttributeError catastrófico.
                    if(self.turtle && typeof self.turtle.resize === 'function') {
                        // Desempaquetamos los valores pasados desde Python a valores puros de JS
                        let w = stretch_wid ? Sk.ffi.remapToJs(stretch_wid) : 1;
                        let l = stretch_len ? Sk.ffi.remapToJs(stretch_len) : 1;
                        self.turtle.resize(w, l);
                    }
                    return Sk.builtin.none.none;
                };
                
                // Registramos los dos nombres comunes en el prototipo de Skulpt
                Sk.builtin.Turtle.prototype.turtlesize = new Sk.builtin.func(mapearFuncionTamano);
                Sk.builtin.Turtle.prototype.shapesize = new Sk.builtin.func(mapearFuncionTamano);
            }
        }

        function ejecutarCodigo() {
            const codigo = editorCodigo.getValue();
            
            consolaElement.innerHTML = "";
            document.getElementById("canvas-tortuga").innerHTML = "";
            
            Sk.configure({
                output: registrarSalidaTexto,
                read: leerModuloIntegrado
            });

            (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'canvas-tortuga';
            Sk.TurtleGraphics.width = 400;
            Sk.TurtleGraphics.height = 400;

            // Inyectamos las mejoras de compatibilidad justo antes de compilar
            inyectarCompatibilidad();

            // Ejecución segura asíncrona compatible con bucles interactivos
            const miPromesaAbs = Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, codigo, true);
            });

            miPromesaAbs.then(function(modulo) {
                consolaElement.innerHTML += "\n> Ejecución finalizada con éxito.";
                consolaElement.scrollTop = consolaElement.scrollHeight;
            }, function(err) {
                consolaElement.innerHTML += `<span style="color: #ff7675;">\nError de ejecución: ${err.toString()}</span>`;
                consolaElement.scrollTop = consolaElement.scrollHeight;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Python con Turtle 🐢</title>
    
    <!-- Cargar Skulpt (Entorno Python + Turtle) -->
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js" type="text/javascript"></script>
    
    <!-- Cargar CodeMirror (Editor con resaltado de colores) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
        }

        .btn-ejecutar {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-ejecutar:hover {
            background-color: #219653;
        }

        /* Contenedor principal de dos paneles */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Panel Izquierdo: Editor de Código */
        .panel-codigo {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #272822; /* Color de fondo del tema Monokai */
            padding: 10px;
            border-right: 2px solid #bdc3c7;
        }

        .panel-codigo label {
            color: #cfcfc2;
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Forzar a CodeMirror a ocupar todo el espacio disponible del panel */
        .CodeMirror {
            flex: 1;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.05rem;
            border-radius: 4px;
        }

        /* Panel Derecho: Consola y Canvas de Turtle */
        .panel-salida {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .contenedor-canvas {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            border-bottom: 2px solid #bdc3c7;
            position: relative;
            overflow: auto;
        }

        #canvas-tortuga {
            border: 1px solid #dfe6e9;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .panel-consola {
            flex: 1;
            background-color: #2d3748;
            color: #a0aec0;
            padding: 15px;
            font-family: monospace;
            overflow-y: auto;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <header>
        <h1>Entorno de Aprendizaje: Python Turtle 🐢</h1>
        <button class="btn-ejecutar" id="btnRun" onclick="ejecutarCodigo()">¡Ejecutar Código! ▶</button>
    </header>

    <div class="workspace">
        <!-- Panel de Código -->
        <div class="panel-codigo">
            <label>Escribe tu código de Python aquí:</label>
            <!-- Este textarea será transformado automáticamente por CodeMirror -->
            <textarea id="editor"># ¡Bienvenido al juego de la Tortuga!
import turtle

t = turtle.Turtle()
t.shape("turtle")
t.speed(3)
t.color("royalblue")

# Dibujemos una estrella para tus alumnos
for i in range(5):
    t.forward(150)
    t.right(144)
</textarea>
        </div>

        <!-- Panel de Resultados -->
        <div class="panel-salida">
            <div class="contenedor-canvas">
                <div id="canvas-tortuga"></div>
            </div>
            <div class="panel-consola" id="consola">> Entorno listo. Escribe código y presiona Ejecutar...</div>
        </div>
    </div>

    <script type="text/javascript">
        const consolaElement = document.getElementById("consola");

        // Inicializar CodeMirror sobre el textarea
        const editorCodigo = CodeMirror.fromTextArea(document.getElementById("editor"), {
            mode: "python",          // Activa los colores específicos para Python
            theme: "monokai",        // Usa el popular tema oscuro Monokai
            lineNumbers: true,       // Muestra los números de línea para guiar a los alumnos
            indentUnit: 4,           // Tabulación estándar de 4 espacios de Python
            tabSize: 4,
            matchBrackets: true      // Resalta los paréntesis cuando cierran
        });

        // Función auxiliar para capturar la salida de texto (print) de Python
        function registrarSalidaTexto(texto) {
            consolaElement.innerHTML += texto;
        }

        // Función para configurar el lector de archivos integrado de Skulpt
        function leerModuloIntegrado(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
                throw "Archivo no encontrado: '" + x + "'";
            }
            return Sk.builtinFiles["files"][x];
        }

        function ejecutarCodigo() {
            // Extraer el código directamente desde la instancia de CodeMirror
            const codigo = editorCodigo.getValue();
            
            // Limpiar la consola y el canvas antes de una nueva ejecución
            consolaElement.innerHTML = "";
            document.getElementById("canvas-tortuga").innerHTML = "";
            
            // Configurar Skulpt
            Sk.configure({
                output: registrarSalidaTexto,
                read: leerModuloIntegrado
            });

            // Indicar el contenedor del canvas gráfico
            (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'canvas-tortuga';
            Sk.TurtleGraphics.width = 400;
            Sk.TurtleGraphics.height = 400;

            // Ejecutar el script
            const miPromesaAbs = Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, codigo, true);
            });

            miPromesaAbs.then(function(modulo) {
                consolaElement.innerHTML += "\n> Ejecución finalizada con éxito.";
                consolaElement.scrollTop = consolaElement.scrollHeight;
            }, function(err) {
                consolaElement.innerHTML += `<span style="color: #ff7675;">\nError: ${err.toString()}</span>`;
                consolaElement.scrollTop = consolaElement.scrollHeight;
            });
        }
    </script>
</body>
</html>
